services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # Criterio: La app espera a que la BD esté lista
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - techcup-network

  backend:
    build: .
    container_name: techcup_backend
    ports:
      - "8080:8080"
    env_file: .env # Manejo seguro de variables
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techcup-network

networks:
  techcup-network: # Criterio: Red personalizada

volumes:
  pgdata: # Criterio: Volumen para persistencia de datos