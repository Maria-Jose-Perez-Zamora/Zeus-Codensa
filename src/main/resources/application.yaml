logging:
  level:
    root: WARN
    controller: INFO
    service: DEBUG
  file:
    name: logs/techcup-futbol.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8443}
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KEY_STORE_PASSWORD:password}
    key-store-type: PKCS12
    key-alias: tomcat

spring:
  datasource:
    # Se usan variables de entorno para Azure y valores por defecto para local
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techcuo_db}
    username: ${DB_USER:techcuo_user}
    # La contraseña NUNCA debe estar en texto plano en el código
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

security:
  jwt:
    # Se parametrizan los valores de JWT para mayor seguridad
    secret: ${JWT_SECRET}
    ttl-ms: ${JWT_TTL_MS:3600000}

app:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/dashboard}