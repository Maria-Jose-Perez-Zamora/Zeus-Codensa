logging:
  level:
    root: INFO
    controller: INFO
    service: DEBUG
  file:
    name: logs/techcup-futbol.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8443}
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KEY_STORE_PASSWORD:password}
    key-store-type: PKCS12
    key-alias: tomcat

spring:
  datasource:
    # Se usan variables de entorno estandar
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techcuo_db}
    username: ${SPRING_DATASOURCE_USERNAME:techcuo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

security:
  jwt:
    # Se parametrizan los valores de JWT para mayor seguridad
    secret: ${JWT_SECRET}
    ttl-ms: ${JWT_TTL_MS:3600000}

app:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/auth/callback}
  mail:
    from: ${MAIL_USERNAME:noreply@techcup.com}