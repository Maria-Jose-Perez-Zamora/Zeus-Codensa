name: CD PROD - Deploy a Azure Container App PROD

# ZEUS-151: Se dispara cuando CI termina exitosamente en 'main'
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline - Techcup Futbol"]
    branches: [ main ]
    types: [ completed ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Deploy a PROD con aprobación manual de 3 personas (ZEUS-151~156)
  # Configurar en GitHub: Settings → Environments → production
  #   → Required reviewers: [persona1, persona2, persona3]
  # ─────────────────────────────────────────────────────────────────
  deploy-prod:
    name: "🚀 Deploy a PROD (requiere aprobación de 3 personas)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production  # ← ZEUS-152: GitHub Environment con 3 Required Reviewers

    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ZEUS-153: Crear tag de versión de producción (v1.3.3) en ACR y actualizar Container App
      - name: Taggear imagen como v1.3.3 en ACR
        run: |
          ACR_NAME=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d'.' -f1)
          az acr import \
            --name "${ACR_NAME}" \
            --source "${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:latest" \
            --image "techcup-backend:v1.3.3" \
            --force
          echo "✅ Imagen publicada con tag: v1.3.3"

      # ZEUS-153: Deploy al Container App PROD usando la imagen versionada
      # ZEUS-154: Inyectar variables de entorno PROD desde GitHub Secrets
      - name: Deploy imagen Docker v1.3.3 a Container App PROD
        env:
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # Configurar credenciales del ACR en el Container App PROD
          az containerapp registry set \
            --name "${{ secrets.PROD_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --server "${{ secrets.ACR_LOGIN_SERVER }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password "${{ secrets.ACR_PASSWORD }}"

          # Actualizar imagen v1.3.3 y variables de entorno PROD
          az containerapp update \
            --name "${{ secrets.PROD_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:v1.3.3" \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=prod \
              "DB_URL=jdbc:postgresql://${{ secrets.PROD_DB_HOST }}:5432/${{ secrets.PROD_DB_NAME }}?sslmode=require" \
              "DB_USER=${{ secrets.PROD_DB_USER }}" \
              "DB_PASSWORD=${DB_PASSWORD}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              SERVER_PORT=8080 \
              SERVER_SSL_ENABLED=false

          echo "✅ Container App PROD actualizado con imagen v1.3.3"

      - name: Esperar que la app inicie (40s)
        run: sleep 40

      # ZEUS-155: Health check post-deploy con ping a DB
      - name: Health check post-deploy PROD + validación DB
        run: |
          # Obtener la URL del Container App PROD dinámicamente
          PROD_FQDN=$(az containerapp show \
            --name "${{ secrets.PROD_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          PROD_URL="https://${PROD_FQDN}"

          echo "🔍 Verificando: ${PROD_URL}/health"
          HTTP_STATUS="000"
          for i in {1..6}; do
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "${PROD_URL}/health" || echo "000")
            echo "Intento ${i}/6 — HTTP: ${HTTP_STATUS}"
            [ "${HTTP_STATUS}" = "200" ] && break
            sleep 15
          done
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "❌ Health check fallido — Status: ${HTTP_STATUS}"
            exit 1
          fi
          BODY=$(curl -k -s "${PROD_URL}/health")
          echo "📊 Respuesta: ${BODY}"
          if echo "${BODY}" | grep -q '"db":"OK"'; then
            echo "✅ PROD Health Check OK — App UP + DB conectada"
          else
            echo "⚠️  App UP pero revisar conectividad de BD"
            exit 1
          fi

          # ZEUS-156: Publicar URL de PROD en GitHub Summary
          echo "## 🚀 Deploy PROD Exitoso — v1.3.3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL PROD | ${PROD_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 Health Check | ${PROD_URL}/health |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Versión | v1.3.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖼️ Imagen ACR | techcup-backend:v1.3.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Rama | main |" >> $GITHUB_STEP_SUMMARY
