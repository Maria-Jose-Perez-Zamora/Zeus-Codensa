name: CI Pipeline - Techcup Futbol

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build, Tests Unitarios, JaCoCo y SonarCloud (ZEUS-123~131)
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: "🧪 Tests + JaCoCo + SonarCloud"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requerido por SonarCloud

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ZEUS-125 + ZEUS-126: Instalar dependencias y ejecutar tests
      - name: Compilar, ejecutar tests y generar reporte JaCoCo
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: VGhpcyBpcyBhVGVzdFNlY3JldEtleUZvclRlc3RzT25seQ==
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          DB_PASSWORD: test-password
        run: mvn -B verify -Dspring.profiles.active=test -Dnet.bytebuddy.experimental=true

      # ZEUS-131: Publicar resumen de tests en el Summary del workflow
      - name: Publicar resumen de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 'Resultados Tests Unitarios'
          path: 'target/surefire-reports/*.xml'
          reporter: 'java-junit'
          fail-on-error: 'false'

      # ZEUS-127: SonarCloud + JaCoCo
      - name: Análisis SonarCloud con cobertura JaCoCo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Zeus-Codensa_Techcup-Futbol \
            -Dsonar.organization=maria-jose-perez-zamora \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dnet.bytebuddy.experimental=true

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build JAR + Docker Image → Push a ACR (ZEUS-129, ZEUS-130)
  # ─────────────────────────────────────────────────────────────────
  docker-build-push:
    name: "🐳 Build Docker Image → Push ACR"
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image_tag: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ZEUS-129: Build del JAR artefacto
      - name: Build JAR artefacto (sin tests)
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: VGhpcyBpcyBhVGVzdFNlY3JldEtleUZvclRlc3RzT25seQ==
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          DB_PASSWORD: test-password
        run: mvn -B package -DskipTests -Dnet.bytebuddy.experimental=true

      # ZEUS-130: Login a ACR
      - name: Login a Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generar tag de versión
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          VERSION="v1.3.3-${BRANCH}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Tag generado: ${VERSION}"

      # ZEUS-130: Build y Push de imagen Docker
      - name: Build y Push imagen Docker a ACR
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.version }}
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"
          echo "✅ Imagen publicada en ACR: ${IMAGE}:${IMAGE_TAG}"

      # ZEUS-131: Publicar summary con info de la imagen
      - name: Publicar resumen en GitHub Summary
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.version }}"
          echo "## 📦 Docker Build Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | \`${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag latest | \`${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
