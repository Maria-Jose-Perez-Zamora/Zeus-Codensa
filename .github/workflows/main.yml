name: CI-CD Pipeline

on:
  push:
    branches: [ main, develop ]

jobs:
  configuracion-secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Validacion de Credenciales de Azure
        run: |
          echo "Simulando inicio de sesión en Azure..."
          echo "Usando Service Principal: ${{ secrets.AZURE_CREDENTIALS }}" | sed 's/./*/g'
          echo "Validación de ACR exitosa."
        # Aquí demostramos que llamamos al secreto correctamente

      - name: Configuracion de Base de Datos QA
        run: |
          echo "Conectando al host de base de datos..."
          # No imprimimos el secreto real, solo validamos que existe
          if [ -n "${{ secrets.QA_DB_PASSWORD }}" ]; then
            echo "La contraseña de QA está configurada correctamente."
          fi
        env:
          DB_USER: ${{ secrets.QA_DB_USER }}
          DB_HOST: ${{ secrets.QA_DB_HOST }}

      - name: Tarea Completada
        run: echo "Todos los secretos fueron cargados y validados mediante ${{ secrets.NOMBRE }}."
