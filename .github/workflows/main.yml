name: CI-CD Pipeline

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Azure
        uses: azure/login@v1
        with:
          # Aquí usamos tu secreto de Azure
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar Base de Datos
        run: |
          echo "Configurando conexión segura..."
        env:
          # Aquí usamos los secretos de QA que creamos
          DB_USER: ${{ secrets.QA_DB_USER }}
          DB_PASS: ${{ secrets.QA_DB_PASSWORD }}
          DB_HOST: ${{ secrets.QA_DB_HOST }}
