name: CD QA - Deploy a Azure Container App QA

# ZEUS-145: Se dispara automáticamente cuando el CI termina exitosamente en 'develop'
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline - Techcup Futbol"]
    branches: [ develop ]
    types: [ completed ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Deploy automático a QA (ZEUS-144 ~ ZEUS-149)
  # ─────────────────────────────────────────────────────────────────
  deploy-qa:
    name: "🚀 Deploy Automático a QA (Container App)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: qa  # GitHub Environment para QA

    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ZEUS-145: Actualizar imagen en Container App QA y configurar registry privado
      - name: Deploy imagen Docker a Container App QA
        env:
          DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # Configurar credenciales del ACR en el Container App
          az containerapp registry set \
            --name "${{ secrets.QA_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --server "${{ secrets.ACR_LOGIN_SERVER }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password "${{ secrets.ACR_PASSWORD }}"

          # ZEUS-146: Actualizar imagen y variables de entorno
          az containerapp update \
            --name "${{ secrets.QA_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:latest" \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=dev \
              "SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.QA_DB_HOST }}:5432/${{ secrets.QA_DB_NAME }}?sslmode=require" \
              "SPRING_DATASOURCE_USERNAME=${{ secrets.QA_DB_USER }}" \
              "SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              SERVER_PORT=8080 \
              SERVER_SSL_ENABLED=false

          echo "✅ Container App QA actualizado con la imagen latest"

      - name: Esperar que la app inicie (40s)
        run: sleep 40

      # ZEUS-147 + ZEUS-148: Health check con validación de DB
      - name: Health check post-deploy QA
        run: |
          # Obtener la URL del Container App dinámicamente
          QA_FQDN=$(az containerapp show \
            --name "${{ secrets.QA_WEBAPP_NAME }}" \
            --resource-group "rg-zeus-codensa" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          QA_URL="https://${QA_FQDN}"

          echo "🔍 Verificando: ${QA_URL}/health"
          HTTP_STATUS="000"
          for i in {1..6}; do
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "${QA_URL}/health" || echo "000")
            echo "Intento ${i}/6 — HTTP: ${HTTP_STATUS}"
            [ "${HTTP_STATUS}" = "200" ] && break
            sleep 15
          done
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "❌ Health check fallido — Status: ${HTTP_STATUS}"
            exit 1
          fi
          BODY=$(curl -k -s "${QA_URL}/health")
          echo "📊 Respuesta: ${BODY}"
          echo "✅ QA Health Check OK (HTTP 200)"

          # ZEUS-149: Publicar URL de QA en GitHub Summary
          echo "## 🟢 Deploy QA Exitoso — v1.3.3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL QA | ${QA_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 Health Check | ${QA_URL}/health |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Versión | v1.3.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Rama | develop |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Imagen | ${{ secrets.ACR_LOGIN_SERVER }}/techcup-backend:latest |" >> $GITHUB_STEP_SUMMARY
